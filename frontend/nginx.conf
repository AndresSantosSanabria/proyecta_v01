server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> backend (BACKEND_URL se inyecta en runtime via envsubst, ver Dockerfile).
    # Sin este bloque, try_files respondia index.html con 200 para /api/v1/* y el
    # frontend pintaba HTML en los formularios en lugar de JSON.
    # proxy_pass SIN barra final: conserva la URI original (/api/v1/...).
    # ^~ evita que la regex de estaticos (abajo) capture rutas /api/* que terminen en .js/.png/etc.
    location ^~ /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Config runtime: nunca cachear, cambia por entorno/arranque.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
