# SonarQube - Proyecta Frontend (análisis con SonarScanner CLI)
# Uso: sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN
sonar.projectKey=proyecta-frontend
sonar.projectName=Proyecta Frontend
sonar.projectVersion=0.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx
sonar.exclusions=dist/**,coverage/**,backend-patch/**,node_modules/**
sonar.coverage.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/test/**

# Cobertura generada por Vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
