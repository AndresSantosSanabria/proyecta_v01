spring.application.name=api-gestion
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=${SERVER_PORT:8082}

# Database Connection (PostgreSQL Persistence)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL Initialization
# Server Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Dashboard Config
dashboard.ventana-vencimiento=7

# Logging Configuration
logging.level.com.proyecta.api_gestion=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.pool-name=ProyectaHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.auto-commit=true

# JPA Settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Tomcat Thread Pool
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.threads.max-keep-alive=60
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10000

# Multipart File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=2MB

# ---------------------------------------------------------------------------
# Keycloak OAuth2 Resource Server Configuration
# ---------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI}
gob.security.resource-client-ids=${GOB_RESOURCE_CLIENT_IDS}
gob.security.cors.allowed-origins=${GOB_CORS_ORIGINS}
gob.security.admin-emails=${GOB_SECURITY_ADMIN_EMAILS:}
gob.seed.users=${GOB_SEED_USERS:}

# ---------------------------------------------------------------------------
# Mail Configuration
# La configuracion SMTP (host, port, SSL, timeouts) se gestiona en
# MailConfig.java mediante un bean @Bean para mayor control.
# Aqui solo se declaran las credenciales y propiedades de aplicacion.
# ---------------------------------------------------------------------------
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
mail.from=${MAIL_USERNAME}
mail.notifications.enabled=true
