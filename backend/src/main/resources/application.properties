spring.application.name=api-gestion

# AWT Headless for JFreeChart
java.awt.headless=true

# Server Configuration
server.port=${SERVER_PORT:8082}

# Database Connection (PostgreSQL Persistence)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=proyecta_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL Initialization
# Server Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Dashboard Config
dashboard.ventana-vencimiento=7

# Logging Configuration
logging.level.com.proyecta.api_gestion=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.pool-name=ProyectaHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.auto-commit=true

# JPA Settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Tomcat Thread Pool
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.threads.max-keep-alive=60
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10000

# Multipart File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=2MB

# ---------------------------------------------------------------------------
# Keycloak OAuth2 Resource Server Configuration
# ---------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://iamqa.cundinamarca.gov.co/realms/gob-cundinamarca-devqa
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://iamqa.cundinamarca.gov.co/realms/gob-cundinamarca-devqa/protocol/openid-connect/certs
gob.security.resource-client-ids=proyecta-web
gob.security.cors.allowed-origins=http://localhost:5173
gob.security.admin-emails=
gob.seed.users=
gob.security.keycloak.client-secret=
gob.security.logout.post-redirect-uri=http://localhost:5173/

# ---------------------------------------------------------------------------
# Mail Configuration
# `spring.mail.username` es el usuario SMTP para autenticarse.
# `mail.from` es la dirección que verá el destinatario como remitente.
# Si no se define una variable de entorno, quedan estos valores por defecto.
# ---------------------------------------------------------------------------
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=notificaciones_proyecta@cundinamarca.gov.co
spring.mail.password=kAx7WABR2gus
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.office365.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN

# Remitente visible en los correos enviados por la aplicación.
mail.from=notificaciones_proyecta@cundinamarca.gov.co
# Activa o desactiva el envío real de correos.
mail.notifications.enabled=true
