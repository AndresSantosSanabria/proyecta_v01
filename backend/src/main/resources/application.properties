spring.application.name=api-gestion

# Database Connection (Configuration)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=proyecta_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.schema-locations=classpath:db/schema_init.sql
spring.sql.init.separator=;;
# spring.sql.init.data-locations is not needed if schema_init has the inserts

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Dashboard Config
dashboard.ventana-vencimiento=7
