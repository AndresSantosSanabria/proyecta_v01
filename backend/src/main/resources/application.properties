spring.application.name=api-gestion
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=${SERVER_PORT:8083}

# Database Connection (PostgreSQL Persistence)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=flyway_schema_history_reboot
spring.flyway.locations=classpath:db/migration_reboot
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL Initialization
# Server Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Dashboard Config
dashboard.ventana-vencimiento=7

# Logging Configuration
logging.level.com.proyecta.api_gestion=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA Settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=false

# Multipart File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=2MB

# ---------------------------------------------------------------------------
# Keycloak OAuth2 Resource Server Configuration
# ---------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI}
gob.security.resource-client-ids=${GOB_RESOURCE_CLIENT_IDS}
gob.security.cors.allowed-origins=${GOB_CORS_ORIGINS}
gob.security.admin-emails=${GOB_SECURITY_ADMIN_EMAILS:}
gob.seed.users=${GOB_SEED_USERS:}
